name: Retrieval gate

on:
  pull_request:
    paths:
      - ledger/retrieval.py
      - ledger/query.py
      - ledger/scoring.py
      - ledger/signals.py
      - ledger/config.py

jobs:
  ab-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed so --baseline-ref main has full history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Run retrieval gate
        env:
          LEDGER_EMBEDDINGS_OFFLINE: "1"
        run: bash scripts/ab_gate.sh
