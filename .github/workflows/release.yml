name: Release

on:
  push:
    tags:
      - 'v*'

# Gates the release on the test suite so a tag never advertises a build that
# fails tests. PyPI publishing happens locally with `uv publish` against
# UV_PUBLISH_TOKEN (see AGENTS.md "Releasing"). This workflow only runs the
# gates, builds the artifacts with `uv build`, and creates the GitHub Release
# with the wheel + sdist attached - it does not touch PyPI.

permissions:
  contents: write    # create the GitHub Release and upload artifacts

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: uv build
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: cognitive-ledger v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
