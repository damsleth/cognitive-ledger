# Cognitive Ledger configuration - copy this file to $XDG_CONFIG_HOME/ledger/config.yaml
# (i.e. ~/.config/ledger/config.yaml) and edit values as needed.
# Values here are overridden by environment variables (LEDGER_ROOT, etc.)

# Set to true on first install. The session_start hook will inject setup instructions
# for the agent and prompt it to build your platform's memory index (e.g. MEMORY.md).
# The agent will set this to false once setup is complete.
first_run: true

# Paths (use ~ for home directory)
# ledger_root: ~/code/cognitive-ledger
# ledger_notes_dir: ~/Code/ledger-notes
# source_notes_dir: ~/Code/notes

# A/B uses ledger_notes_dir by default. Override with: ledger ab run --corpus <path>

# Retrieval tuning
# retrieval_mode: semantic_hybrid
# embed_backend: local
# embed_model: TaylorAI/bge-micro-v2

# Scoring weights (must sum to ~1.0)
# score_weight_bm25: 0.30
# score_weight_lexical: 0.15
# score_weight_tag: 0.15
# score_weight_scope: 0.15
# score_weight_recency: 0.15
# score_weight_confidence: 0.10

# Shortlisting
# shortlist_min_candidates: 24
# shortlist_max_candidates: 36

# Prior score (Mechanism 1 — cold-start ranking, always-on by default)
# Adds a small additive term combining confidence, half-life recency, and query
# relevance. Makes ranking non-flat before signal feedback has accrued.
# Set prior_enabled to false to reproduce pre-prior scores exactly (A/B baseline).
# prior_enabled: true
# prior_weight: 0.10
# prior_w_importance: 0.30
# prior_w_recency: 0.30
# prior_w_relevance: 0.40
# prior_recency_half_life_days: 180.0

# Fusion mode for semantic_hybrid (Mechanism 3 / FUSION)
# "weighted_sum" (default, preserves existing behaviour) or "rrf" (Reciprocal
# Rank Fusion — generates lexical + semantic rank lists separately then merges).
# Enable rrf only after A/B eval confirms improvement.
# fusion: weighted_sum
# rrf_k: 60

# Pseudo-Relevance Feedback (Mechanism 2 — dense path only, default off)
# Expands the query vector via Rocchio from the top-m / bottom-n results.
# Enable only after A/B eval. CLI flag --prf overrides this per query.
# prf_enabled: false
# prf_top_m: 3
# prf_bottom_n: 5
# prf_alpha: 1.0
# prf_beta: 0.75
# prf_gamma: 0.15
