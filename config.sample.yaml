# Cognitive Ledger configuration - copy this file to $XDG_CONFIG_HOME/ledger/config.yaml
# (i.e. ~/.config/ledger/config.yaml) and edit values as needed.
# Values here are overridden by environment variables (LEDGER_ROOT, etc.)

# Set to true on first install. The session_start hook will inject setup instructions
# for the agent and prompt it to build your platform's memory index (e.g. MEMORY.md).
# The agent will set this to false once setup is complete.
first_run: true

# Paths (use ~ for home directory)
# ledger_root: ~/code/cognitive-ledger
# ledger_notes_dir: ~/Code/ledger-notes
# source_notes_dir: ~/Code/notes

# A/B uses ledger_notes_dir by default. Override with: ledger ab run --corpus <path>

# Retrieval tuning
# retrieval_mode: semantic_hybrid
# embed_backend: local
# embed_model: TaylorAI/bge-micro-v2

# Scoring weights (must sum to ~1.0)
# score_weight_bm25: 0.30
# score_weight_lexical: 0.15
# score_weight_tag: 0.15
# score_weight_scope: 0.15
# score_weight_recency: 0.15
# score_weight_confidence: 0.10

# Provenance-weighted confidence (plan 42 — off by default, A/B-gate before enabling)
# When enabled, ranking replaces raw `confidence` with an effective value:
#   effective = confidence × provenance_weight + min(boost_per × affirmations, cap)
# provenance_weight comes from the note's `provenance` frontmatter field
# (explicit_statement 1.0 > validated 0.95 > corrected 0.9 > observed 0.85 >
# imported 0.8 > inferred 0.7); absent values are derived from source/via.
# Leave false to reproduce pre-plan-42 scores exactly.
# provenance_weighting_enabled: false
# validation_boost_per_signal: 0.03
# validation_boost_cap: 0.15

# Shortlisting
# shortlist_min_candidates: 24
# shortlist_max_candidates: 36

# Contradiction detection (Gap B — NLI-based sleep scan)
# Off by default; requires the NLI model to be downloaded first.
# CAVEAT: Norwegian (lang:no) accuracy is unvalidated — XNLI has no Norwegian
# training data. Use a stricter threshold for Norwegian-language corpora.
# contradiction_enabled: false
# contradiction_model: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
# contradiction_neighbors_k: 8
# contradiction_auto_threshold: 0.85
# contradiction_review_threshold: 0.60
# contradiction_auto_threshold_lang_no: 0.95
# contradiction_protect_higher_confidence: true

# Prior score (Mechanism 1 — cold-start ranking, always-on by default)
# Combines confidence, half-life recency, and query relevance, and is applied
# as a TIE-BREAKER: its contribution scales continuously to zero as a
# candidate's base (pre-prior) score gap to the local leader exceeds
# prior_tie_band (a relative gap). A candidate with a clear base-score lead
# keeps its rank regardless of prior — the prior only reorders near-ties.
# Set prior_enabled to false to reproduce pre-prior scores exactly (A/B baseline).
# prior_enabled: true
# prior_weight: 0.10
# prior_tie_band: 0.02          # relative base-score gap within which the prior breaks ties
# prior_w_importance: 0.30
# prior_w_recency: 0.30
# prior_w_relevance: 0.40
# prior_recency_half_life_days: 180.0

# Fusion mode for semantic_hybrid (Mechanism 3 / FUSION)
# "weighted_sum" (default, preserves existing behaviour) or "rrf" (Reciprocal
# Rank Fusion — generates lexical + semantic rank lists separately then merges).
# Keep weighted_sum: on the real corpus RRF measures worse (hit@1 0.467 vs
# 0.733) because k=60 flattens rank differences on small candidate pools.
# fusion: weighted_sum
# rrf_k: 60

# Pseudo-Relevance Feedback (Mechanism 2 — dense path only, default off)
# Expands the query vector via Rocchio from the top-m / bottom-n results.
# Enable only after A/B eval. CLI flag --prf overrides this per query.
# prf_enabled: false
# prf_top_m: 3
# prf_bottom_n: 5
# prf_alpha: 1.0
# prf_beta: 0.75
# prf_gamma: 0.15

# Things3 ⇄ open-loops sync
# Requires: Things3 app + Things CLI on PATH (https://culturedcode.com/things/support/articles/2803573/)
# Run: ledger loops sync           — one-shot sync (dry-run: --dry-run)
# things3_sync_enabled: false
# things3_default_project: ""      # Things project for new tasks; empty = Inbox
# things3_blocked_project: ""      # Project for status:blocked loops; empty = same as default
# things3_scope_routing:            # per-scope project override
#   work: "Work Tasks"
#   dev: "Dev"
#   home: "Home"
# things3_marker_prefix: "ledger:"  # embedded in task Notes to link back; don't change after first sync
# things3_completed_maps_to: "closed"   # ledger status when Things task completed
# things3_canceled_maps_to: "snoozed"  # ledger status when Things task cancelled
# things3_orphan_action: "flag"     # flag | cancel | ignore orphaned tasks

# LLM-judged signal seeding (Mechanism 3 — bootstrap the signal gate)
# Run: ledger signal seed --from-history  (or --queries-file <path>)
# Seeded events carry synthetic:true and are down-weighted by synthetic_weight.
# Roll back with: ledger signal purge --synthetic
# synthetic_weight: 0.5
# judge_backend: dummy          # "dummy" (lexical heuristic) or "subprocess"
# judge_subprocess_command: ""  # e.g. "claude -p" for the subprocess backend
# judge_seed_top_k: 5           # notes retrieved per query during seeding
