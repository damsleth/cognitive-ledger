# T3 — Implicit conflict pairs for attribute-slot model evaluation
#
# Loader: tests/test_contradiction_fixtures.py
# Consumed by: Plan 09 (attribute-slot model, T3 gate)
#
# Schema per entry:
#   note_a, note_b : short synthetic notes (no private content)
#   relation       : contradiction  (all entries here are conflicts)
#   attribute      : the shared attribute slot key that should trigger collision
#   lang           : en | no
#   type           : co_referential | propagated
#   dependency (Type-II only): the reasoning chain that creates the conflict
#
# Pure NLI is expected to underperform (~55% ceiling) on these cases.
# "NLI + attribute-slot keying" (Plan 09) is the intended resolver.
#
# Type I  (co_referential)  — no lexical overlap, same attribute slot: ≥10 required
# Type II (propagated)      — conflict exists only via a dependency chain: ≥10 required

