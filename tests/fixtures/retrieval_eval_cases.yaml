# Retrieval eval cases — full benchmark set
#
# Fixture corpus: tests/fixtures/corpus/
# Run eval:       LEDGER_ROOT=tests/fixtures/corpus ledger eval --cases tests/fixtures/retrieval_eval_cases.yaml --k 3 --strict-cases
# Run A/B:        LEDGER_ROOT=tests/fixtures/corpus ledger ab run --baseline-ref main --candidate-ref HEAD --cases tests/fixtures/retrieval_eval_cases.yaml --k 3
#
# Case taxonomy:
#   gen_*       General positive cases (~25) — straightforward query→note, covers all folder types.
#               These protect the common retrieval path against regressions.
#   hop_*       Multi-hop positive cases (~8) — answer requires linking 2+ notes across folders.
#               expected_any lists either note; satisfying one is enough.
#               These gate Plan 13 (associative PPR retrieval, T5).
#   temporal_*  Temporal cases (~6) — queries about time-sensitive facts.
#               temporal_1–4 (current state) should pass with baseline lexical mode.
#               temporal_5–6 (as-of archive queries) are expected to fail with baseline;
#               they gate Plan 06 (bitemporal event-time wiring, A1).
#   neg_*       Negative cases (~8, expected_none: true) — queries with no relevant note.
#               These gate admission control and guard false_positive_rate.
#               These gate Plan 04 (rerank, B1) and Plan 08 (contradiction→open-loop, D3).

