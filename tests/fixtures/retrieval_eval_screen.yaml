# Retrieval eval screen set — fast subset for ab loop screening
#
# Corpus: tests/fixtures/corpus/
# Purpose: Quick first-pass filter in `ledger ab loop --screen-cases`.
#          10 simple general cases; fast to run, good signal on regressions.
#          Disjoint from retrieval_eval_holdout.yaml.
#
# These are gen_1–gen_10 from the full benchmark.

