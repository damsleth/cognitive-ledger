[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-ledger"
version = "0.4.1"
description = "File-based memory system for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy",
    "scikit-learn",
    "rank-bm25",
    "watchdog>=6.0.0",
]

[project.scripts]
ledger = "ledger.cli:main"
ledger-obsidian = "ledger.obsidian.cli:main"

[project.optional-dependencies]
dev = ["pyinstaller", "pytest>=8.0", "httpx>=0.27"]
embeddings = [
    "sentence-transformers>=5.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]
# Everything needed to run the full test suite without skips
# (web UI + chart rendering). Embeddings tests skip gracefully on their own.
test = [
    "cognitive-ledger[dev,web]",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
